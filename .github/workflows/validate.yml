name: Validate Docker Compose Labs

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare safe environment files
        run: |
          cp session-36-networks/.env.example session-36-networks/.env
          cp session-37-depends-on-restart/.env.example session-37-depends-on-restart/.env

      - name: Validate Session 36 Compose configuration
        run: docker compose --env-file session-36-networks/.env -f session-36-networks/compose.yaml config --quiet

      - name: Build Session 36 images
        run: docker compose --env-file session-36-networks/.env -f session-36-networks/compose.yaml build --pull

      - name: Validate Session 37 Compose configuration
        run: docker compose --env-file session-37-depends-on-restart/.env -f session-37-depends-on-restart/compose.yaml config --quiet

      - name: Pull Session 37 images
        run: docker compose --env-file session-37-depends-on-restart/.env -f session-37-depends-on-restart/compose.yaml pull

      - name: Validate shell scripts
        run: |
          bash -n session-36-networks/scripts/verify.sh
          bash -n session-37-depends-on-restart/scripts/verify.sh
          bash -n session-37-depends-on-restart/scripts/test-restart-behavior.sh
